<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion YouTube Music Widget</title>
  
  <!-- Force dark color scheme -->
  <meta name="color-scheme" content="dark">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  
  <style>
    :root, html, body {
      background-color: transparent !important;
      background: transparent !important;
      color-scheme: dark !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    /* Marquee animation for long track names */
    .marquee-container {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .marquee-content {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 12s linear infinite;
    }
    .marquee-container:hover .marquee-content {
      animation-play-state: paused;
    }
    @keyframes marquee {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    /* Range Sliders */
    input[type=range] {
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      height: 4px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: var(--accent-color, #8b5cf6);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Custom Scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }

    /* Card styling */
    .widget-card {
      background-color: var(--card-bg, rgba(30, 41, 59, 0.95));
      backdrop-filter: blur(var(--card-blur, 12px));
      -webkit-backdrop-filter: blur(var(--card-blur, 12px));
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #yt-player-frame {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
    }

    /* Pulsing border animation to grab attention when playlist changes */
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(139, 92, 246, 0.8); box-shadow: 0 0 10px rgba(139, 92, 246, 0.5); }
      50% { border-color: rgba(236, 72, 153, 0.8); box-shadow: 0 0 18px rgba(236, 72, 153, 0.7); }
    }
    .highlight-embed-box {
      animation: pulse-border 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-1 select-none">

  <!-- Compact Height Widget Container -->
  <div id="widget" class="widget-card relative w-full max-w-md rounded-2xl p-3 shadow-2xl text-white transition-all duration-300 overflow-hidden">
    
    <!-- Background Image / GIF Layer -->
    <div id="bg-overlay" class="absolute inset-0 bg-cover bg-center pointer-events-none transition-opacity duration-300 opacity-0" style="z-index: 0;"></div>
    <div id="bg-dim" class="absolute inset-0 bg-black/40 pointer-events-none transition-opacity duration-300 opacity-0" style="z-index: 1;"></div>

    <!-- Main Content -->
    <div class="relative z-10 flex flex-col gap-2">
      
      <!-- Top Section: Track Header -->
      <div class="flex items-center gap-2.5">
        <!-- Thumbnail -->
        <div class="relative group w-11 h-11 flex-shrink-0 rounded-lg overflow-hidden bg-black/40 border border-white/10 shadow-inner">
          <img id="track-thumb" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150&auto=format&fit=crop&q=80" alt="Thumbnail" class="w-full h-full object-cover">
        </div>

        <!-- Track Info -->
        <div class="flex-1 min-w-0">
          <div class="marquee-container w-full">
            <h1 id="track-title" class="marquee-content font-bold text-xs text-white">Select or Load a Playlist</h1>
          </div>
          
          <div class="flex items-center gap-2 mt-0.5">
            <span id="player-status" class="bg-white/10 px-1.5 py-0.5 rounded text-[10px] text-white/70 font-medium">Ready</span>
            <span class="text-[10px] text-white/50 font-mono"><span id="curr-time">0:00</span> / <span id="total-time">0:00</span></span>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-1">
          <button id="restart-btn" class="text-white/60 hover:text-white p-1 transition-colors" title="Restart Playlist">
            <i class="fa-solid fa-rotate-left text-xs"></i>
          </button>
          
          <button id="settings-toggle" class="text-white/60 hover:text-white p-1 transition-colors relative" title="Settings">
            <i class="fa-solid fa-sliders text-xs"></i>
            <span id="settings-badge" class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-amber-400 rounded-full animate-ping hidden"></span>
          </button>
        </div>
      </div>

      <!-- Scrubber -->
      <div class="w-full">
        <input type="range" id="progress-bar" min="0" max="100" value="0" class="w-full cursor-pointer">
      </div>

      <!-- Controls Row -->
      <div class="flex items-center justify-between pt-0.5">
        <!-- Volume Control -->
        <div class="flex items-center gap-1.5 w-20">
          <button id="mute-btn" class="text-white/70 hover:text-white transition-colors">
            <i id="volume-icon" class="fa-solid fa-volume-high text-[11px]"></i>
          </button>
          <input type="range" id="volume-slider" min="0" max="100" value="80" class="w-full">
        </div>

        <!-- Playback Controls -->
        <div class="flex items-center gap-3">
          <button id="prev-btn" class="text-white/70 hover:text-white transition-colors text-xs">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          <button id="play-btn" class="w-8 h-8 rounded-full bg-violet-600 text-white flex items-center justify-center hover:scale-105 transition-all shadow-md">
            <i id="play-icon" class="fa-solid fa-play text-xs translate-x-0.5"></i>
          </button>
          <button id="next-btn" class="text-white/70 hover:text-white transition-colors text-xs">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

        <!-- Shuffle & Repeat -->
        <div class="flex items-center gap-2">
          <button id="shuffle-btn" class="text-white/40 hover:text-white transition-colors text-xs p-1" title="Shuffle Playlist">
            <i class="fa-solid fa-shuffle"></i>
          </button>
          <button id="loop-btn" class="text-white/40 hover:text-white transition-colors text-xs p-1" title="Repeat/Loop Playlist">
            <i class="fa-solid fa-repeat"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settings-panel" class="absolute inset-0 z-20 bg-slate-900/95 backdrop-blur-md p-3 flex flex-col h-full transition-all duration-300 opacity-0 pointer-events-none translate-y-3">
      <div class="flex items-center justify-between border-b border-white/10 pb-1.5 mb-2 flex-shrink-0">
        <h2 class="text-xs font-bold uppercase tracking-wider text-white/80"><i class="fa-solid fa-gear mr-1"></i> Widget Settings</h2>
        <button id="close-settings" class="text-white/60 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="custom-scroll flex-1 overflow-y-auto space-y-2.5 text-xs pr-1.5 pb-4">
        
        <!-- Playlist Input Section -->
        <div class="space-y-1.5">
          <label class="block text-white/70 text-[11px]">YouTube Playlist URL</label>
          <div class="flex gap-1.5">
            <input type="text" id="playlist-input" placeholder="https://www.youtube.com/playlist?list=..." class="flex-1 bg-black/40 border border-white/10 rounded-lg px-2 py-1 text-white text-[11px] placeholder-white/30 focus:outline-none focus:border-violet-500">
            <button id="load-playlist-btn" class="bg-violet-600 hover:bg-violet-500 px-2.5 py-1 rounded-lg font-medium text-white text-[11px] transition-colors flex-shrink-0">Load</button>
          </div>
          <p id="playlist-msg" class="text-[10px] hidden"></p>

          <!-- DYNAMIC ATTENTION CALLOUT BANNER -->
          <div id="embed-callout-banner" class="mt-2 p-2.5 rounded-xl bg-gradient-to-r from-amber-500/20 via-violet-600/20 to-purple-600/20 border border-amber-500/40 relative overflow-hidden transition-all duration-300">
            <div class="flex items-start gap-2">
              <div class="w-5 h-5 rounded-full bg-amber-500/30 text-amber-300 flex items-center justify-center flex-shrink-0 mt-0.5">
                <i class="fa-solid fa-triangle-exclamation text-[10px]"></i>
              </div>
              <div class="flex-1 text-[11px] leading-snug">
                <strong class="text-amber-200 font-semibold block mb-0.5">Important Notion Step:</strong>
                <p class="text-white/80">To save this playlist and settings permanently in Notion, replace your embed block with the unique link below!</p>
              </div>
            </div>
          </div>

          <!-- Auto-Generated Unique Embed Link Box -->
          <div id="embed-link-box" class="bg-black/60 p-2.5 rounded-xl border border-violet-500/40 space-y-1.5 mt-1 transition-all duration-300">
            <div class="flex justify-between items-center">
              <span class="text-[10px] text-violet-300 font-semibold flex items-center gap-1">
                <i class="fa-solid fa-link text-[9px]"></i> Unique Embed Link
              </span>
              <div class="flex items-center gap-2">
                <button id="regen-id-btn" class="text-[10px] text-white/60 hover:text-white transition-colors" title="Generate New Unique ID">
                  <i class="fa-solid fa-arrows-rotate mr-0.5"></i> New ID
                </button>
                <button id="copy-notion-embed-btn" class="bg-violet-600 hover:bg-violet-500 text-white font-medium px-2 py-0.5 rounded text-[10px] transition-all shadow-md flex items-center gap-1">
                  <i class="fa-regular fa-copy"></i> Copy Link
                </button>
              </div>
            </div>
            <code id="generated-notion-url" class="text-[10px] text-white/90 block break-all font-mono bg-black/50 p-2 rounded-lg border border-white/5 select-all">https://custom-yt-playlist-widget.vercel.app/</code>
          </div>
        </div>

        <!-- Color Customization -->
        <div class="grid grid-cols-2 gap-2 pt-1 border-t border-white/10">
          <div>
            <label class="block text-white/70 mb-1 text-[11px]">Card Color</label>
            <input type="color" id="card-color-picker" value="#1e293b" class="w-full h-7 rounded border-0 bg-transparent cursor-pointer">
          </div>
          <div>
            <label class="block text-white/70 mb-1 text-[11px]">Accent Color</label>
            <input type="color" id="accent-color-picker" value="#8b5cf6" class="w-full h-7 rounded border-0 bg-transparent cursor-pointer">
          </div>
        </div>

        <!-- Opacity Slider -->
        <div>
          <div class="flex justify-between text-white/70 mb-1 text-[11px]">
            <span>Card Opacity</span>
            <span id="opacity-val">90%</span>
          </div>
          <input type="range" id="card-opacity" min="10" max="100" value="90" class="w-full">
        </div>

        <!-- Background Image/GIF -->
        <div>
          <label class="block text-white/70 mb-1 text-[11px]">Background Image/GIF URL</label>
          <input type="text" id="bg-url-input" placeholder="https://... image/gif" class="w-full bg-black/40 border border-white/10 rounded-lg px-2 py-1 text-white text-[11px] placeholder-white/30 focus:outline-none focus:border-violet-500">
        </div>
      </div>
    </div>
  </div>

  <div id="yt-player-frame"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  
  <script>
    let player = null;
    let isPlaying = false;
    let isShuffle = false;
    let isLoop = false;
    let updateTimer = null;
    let currentPlaylistId = 'PL4fGSI1pTjv1-0m-9Z-9vXN-U9j_o9z-A';

    // Parse URL Query Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const instanceId = urlParams.get('id') || urlParams.get('page') || 'default';
    const directPlaylistParam = urlParams.get('playlist') || urlParams.get('list');

    // Dynamic Base URL Detection
    const baseUrl = window.location.origin + window.location.pathname;

    // Active session unique ID variable
    let sessionUniqueId = instanceId !== 'default' ? instanceId : generateRandomUniqueId();

    // Generate a unique ID (e.g. "pg_a8f2k9x1")
    function generateRandomUniqueId() {
      return 'pg_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36).substring(4);
    }

    // Storage keys unique to each instance/id + global fallback
    const KEY_CARD_COLOR = `yt_card_color_${instanceId}`;
    const KEY_ACCENT_COLOR = `yt_accent_color_${instanceId}`;
    const KEY_OPACITY = `yt_card_opacity_${instanceId}`;
    const KEY_BG_URL = `yt_bg_url_${instanceId}`;
    const KEY_PLAYLIST_URL = `yt_playlist_url_${instanceId}`;
    const GLOBAL_PLAYLIST_KEY = `yt_global_last_playlist_url`;

    function updateGeneratedEmbedUrl(rawPlaylist) {
      const generatedCode = document.getElementById('generated-notion-url');
      const cleanBase = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
      const cleanId = extractPlaylistId(rawPlaylist);

      if (cleanId) {
        generatedCode.textContent = `${cleanBase}?playlist=${cleanId}&id=${sessionUniqueId}`;
      } else {
        generatedCode.textContent = `${cleanBase}?id=${sessionUniqueId}`;
      }
    }

    function safeStorageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function safeStorageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        // Fallback or quiet failure
      }
    }

    function loadSavedSettings() {
      const savedCardColor = safeStorageGet(KEY_CARD_COLOR) || '#1e293b';
      const savedAccentColor = safeStorageGet(KEY_ACCENT_COLOR) || '#8b5cf6';
      const savedOpacity = safeStorageGet(KEY_OPACITY) || '90';
      const savedBgUrl = safeStorageGet(KEY_BG_URL) || '';
      
      let savedPlaylistUrl = directPlaylistParam 
        || safeStorageGet(KEY_PLAYLIST_URL) 
        || safeStorageGet(GLOBAL_PLAYLIST_KEY) 
        || '';

      document.getElementById('card-color-picker').value = savedCardColor;
      document.getElementById('accent-color-picker').value = savedAccentColor;
      document.getElementById('card-opacity').value = savedOpacity;
      document.getElementById('bg-url-input').value = savedBgUrl;
      document.getElementById('playlist-input').value = savedPlaylistUrl;

      if (savedPlaylistUrl) {
        const extracted = extractPlaylistId(savedPlaylistUrl);
        if (extracted) currentPlaylistId = extracted;
      }

      updateGeneratedEmbedUrl(savedPlaylistUrl);
      applyTheme(savedCardColor, savedAccentColor, savedOpacity, savedBgUrl);
    }

    function applyTheme(cardHex, accentHex, opacity, bgUrl) {
      document.documentElement.style.setProperty('--accent-color', accentHex);
      
      const r = parseInt(cardHex.slice(1, 3), 16);
      const g = parseInt(cardHex.slice(3, 5), 16);
      const b = parseInt(cardHex.slice(5, 7), 16);
      const rgba = `rgba(${r}, ${g}, ${b}, ${opacity / 100})`;
      document.documentElement.style.setProperty('--card-bg', rgba);

      const playBtn = document.getElementById('play-btn');
      playBtn.style.backgroundColor = accentHex;
      playBtn.style.boxShadow = `0 4px 12px ${accentHex}50`;

      const bgOverlay = document.getElementById('bg-overlay');
      const bgDim = document.getElementById('bg-dim');
      if (bgUrl && bgUrl.trim() !== '') {
        bgOverlay.style.backgroundImage = `url('${bgUrl.trim()}')`;
        bgOverlay.style.opacity = '1';
        bgDim.style.opacity = '1';
      } else {
        bgOverlay.style.opacity = '0';
        bgDim.style.opacity = '0';
      }
    }

    function createPlayer(playlistId) {
      if (player && typeof player.destroy === 'function') {
        player.destroy();
      }

      player = new YT.Player('yt-player-frame', {
        height: '200',
        width: '200',
        playerVars: {
          listType: 'playlist',
          list: playlistId,
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onYouTubeIframeAPIReady() {
      createPlayer(currentPlaylistId);
    }

    function onPlayerReady(event) {
      document.getElementById('player-status').textContent = 'Ready';
      updateTrackInfo();
    }

    function updatePlayButtonUI(playing) {
      isPlaying = playing;
      const playIcon = document.getElementById('play-icon');
      if (playing) {
        playIcon.className = 'fa-solid fa-pause text-xs';
      } else {
        playIcon.className = 'fa-solid fa-play text-xs translate-x-0.5';
      }
    }

    function onPlayerStateChange(event) {
      const statusBadge = document.getElementById('player-status');

      if (event.data === YT.PlayerState.PLAYING) {
        updatePlayButtonUI(true);
        statusBadge.textContent = 'Playing';
        startTimer();
      } else if (event.data === YT.PlayerState.PAUSED) {
        updatePlayButtonUI(false);
        statusBadge.textContent = 'Paused';
        stopTimer();
      } else if (event.data === YT.PlayerState.BUFFERING) {
        statusBadge.textContent = 'Buffering';
      } else if (event.data === YT.PlayerState.ENDED) {
        updatePlayButtonUI(false);
        statusBadge.textContent = 'Ended';
        stopTimer();
      } else {
        updatePlayButtonUI(false);
        statusBadge.textContent = 'Ready';
        stopTimer();
      }
      updateTrackInfo();
    }

    function updateTrackInfo() {
      if (!player || typeof player.getVideoData !== 'function') return;
      const data = player.getVideoData();
      if (data && data.title) {
        document.getElementById('track-title').textContent = data.title;
        const videoId = data.video_id;
        if (videoId) {
          document.getElementById('track-thumb').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
        }
      }
    }

    function startTimer() {
      stopTimer();
      updateTimer = setInterval(() => {
        if (!player || !isPlaying) return;
        const current = player.getCurrentTime() || 0;
        const total = player.getDuration() || 0;
        document.getElementById('curr-time').textContent = formatTime(current);
        document.getElementById('total-time').textContent = formatTime(total);
        if (total > 0) {
          document.getElementById('progress-bar').value = (current / total) * 100;
        }
      }, 500);
    }

    function stopTimer() {
      if (updateTimer) clearInterval(updateTimer);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function extractPlaylistId(input) {
      if (!input) return '';
      const str = input.trim();
      const listMatch = str.match(/[?&]list=([^&]+)/);
      if (listMatch && listMatch[1]) return listMatch[1];

      if (/^[A-Za-z0-9_-]{12,}$/.test(str)) {
        return str;
      }
      return '';
    }

    function triggerEmbedBoxHighlight() {
      const box = document.getElementById('embed-link-box');
      box.classList.add('highlight-embed-box');
      setTimeout(() => {
        box.classList.remove('highlight-embed-box');
      }, 4000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSavedSettings();

      const settingsPanel = document.getElementById('settings-panel');

      document.getElementById('settings-toggle').addEventListener('click', () => {
        settingsPanel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      });
      
      document.getElementById('close-settings').addEventListener('click', () => {
        settingsPanel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
      });

      // Live update generated URL as user types
      document.getElementById('playlist-input').addEventListener('input', (e) => {
        updateGeneratedEmbedUrl(e.target.value);
      });

      // Regenerate Random ID Button
      document.getElementById('regen-id-btn').addEventListener('click', () => {
        sessionUniqueId = generateRandomUniqueId();
        const rawUrl = document.getElementById('playlist-input').value;
        updateGeneratedEmbedUrl(rawUrl);
        triggerEmbedBoxHighlight();
      });

      // Copy Notion embed link button
      document.getElementById('copy-notion-embed-btn').addEventListener('click', () => {
        const generatedCode = document.getElementById('generated-notion-url').textContent;
        const btn = document.getElementById('copy-notion-embed-btn');
        navigator.clipboard.writeText(generatedCode.trim()).then(() => {
          const originalHTML = btn.innerHTML;
          btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
          btn.classList.remove('bg-violet-600', 'hover:bg-violet-500');
          btn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
          setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
            btn.classList.add('bg-violet-600', 'hover:bg-violet-500');
          }, 2000);
        });
      });

      document.getElementById('play-btn').addEventListener('click', () => {
        if (!player) return;
        if (isPlaying) {
          player.pauseVideo();
        } else {
          player.playVideo();
        }
      });

      document.getElementById('next-btn').addEventListener('click', () => player && player.nextVideo());
      document.getElementById('prev-btn').addEventListener('click', () => player && player.previousVideo());

      document.getElementById('restart-btn').addEventListener('click', () => {
        if (player && typeof player.playVideoAt === 'function') {
          player.playVideoAt(0);
        }
      });

      document.getElementById('shuffle-btn').addEventListener('click', () => {
        if (!player) return;
        isShuffle = !isShuffle;
        player.setShuffle(isShuffle);
        document.getElementById('shuffle-btn').classList.toggle('text-violet-400', isShuffle);
        document.getElementById('shuffle-btn').classList.toggle('text-white/40', !isShuffle);
      });

      document.getElementById('loop-btn').addEventListener('click', () => {
        if (!player) return;
        isLoop = !isLoop;
        player.setLoop(isLoop);
        document.getElementById('loop-btn').classList.toggle('text-violet-400', isLoop);
        document.getElementById('loop-btn').classList.toggle('text-white/40', !isLoop);
      });

      document.getElementById('volume-slider').addEventListener('input', (e) => {
        if (!player) return;
        const val = e.target.value;
        player.setVolume(val);
        const icon = document.getElementById('volume-icon');
        if (val == 0) {
          icon.className = 'fa-solid fa-volume-xmark text-xs text-red-400';
        } else if (val < 50) {
          icon.className = 'fa-solid fa-volume-low text-xs';
        } else {
          icon.className = 'fa-solid fa-volume-high text-xs';
        }
      });

      document.getElementById('progress-bar').addEventListener('input', (e) => {
        if (!player) return;
        const total = player.getDuration() || 0;
        const seekTo = (e.target.value / 100) * total;
        player.seekTo(seekTo, true);
      });

      const updateThemeFromInputs = () => {
        const cardColor = document.getElementById('card-color-picker').value;
        const accentColor = document.getElementById('accent-color-picker').value;
        const opacity = document.getElementById('card-opacity').value;
        const bgUrl = document.getElementById('bg-url-input').value;

        document.getElementById('opacity-val').textContent = `${opacity}%`;
        applyTheme(cardColor, accentColor, opacity, bgUrl);

        safeStorageSet(KEY_CARD_COLOR, cardColor);
        safeStorageSet(KEY_ACCENT_COLOR, accentColor);
        safeStorageSet(KEY_OPACITY, opacity);
        safeStorageSet(KEY_BG_URL, bgUrl);
      };

      document.getElementById('card-color-picker').addEventListener('input', updateThemeFromInputs);
      document.getElementById('accent-color-picker').addEventListener('input', updateThemeFromInputs);
      document.getElementById('card-opacity').addEventListener('input', updateThemeFromInputs);
      document.getElementById('bg-url-input').addEventListener('input', updateThemeFromInputs);

      // Load Playlist Action
      document.getElementById('load-playlist-btn').addEventListener('click', () => {
        const rawUrl = document.getElementById('playlist-input').value;
        const cleanPlaylistId = extractPlaylistId(rawUrl);
        const msg = document.getElementById('playlist-msg');

        if (!cleanPlaylistId) {
          msg.textContent = '❌ Invalid URL. Please copy a playlist link.';
          msg.className = 'text-[10px] mt-1 text-red-400 block';
          return;
        }

        msg.textContent = '⏳ Loaded! Copy link below to lock into Notion.';
        msg.className = 'text-[10px] mt-1 text-emerald-400 block';

        currentPlaylistId = cleanPlaylistId;
        
        // Save both locally and globally
        safeStorageSet(KEY_PLAYLIST_URL, rawUrl);
        safeStorageSet(GLOBAL_PLAYLIST_KEY, rawUrl);
        updateGeneratedEmbedUrl(rawUrl);
        triggerEmbedBoxHighlight();

        try {
          if (player && typeof player.loadPlaylist === 'function') {
            player.loadPlaylist({
              listType: 'playlist',
              list: currentPlaylistId,
              index: 0,
              startSeconds: 0
            });
          } else {
            createPlayer(currentPlaylistId);
          }
        } catch (err) {
          createPlayer(currentPlaylistId);
        }
      });
    });
  </script>
</body>
</html>
