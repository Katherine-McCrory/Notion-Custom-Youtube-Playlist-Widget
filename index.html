<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion YouTube Music Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: transparent;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        /* Custom scrollbar for settings modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Smooth slider styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color, #a855f7);
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        /* Glassmorphism background effect */
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .bg-cover-image {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s ease-in-out;
        }
    </style>
</head>
<body class="p-2 flex items-center justify-center min-h-screen">

    <div id="playerCard" class="relative w-full max-w-md h-[210px] rounded-2xl p-4 flex flex-col justify-between overflow-hidden shadow-2xl border border-white/10 glass-panel bg-cover-image transition-all duration-300">
        
        <!-- Dark Overlay for Readability -->
        <div id="cardOverlay" class="absolute inset-0 bg-black/60 z-0 transition-opacity duration-300"></div>

        <!-- Top Header & Settings Trigger -->
        <div class="relative z-10 flex items-center justify-between">
            <div class="flex items-center gap-2.5 overflow-hidden">
                <div id="accentBadge" class="w-2.5 h-7 rounded-full bg-purple-500 flex-shrink-0 transition-colors"></div>
                <div class="overflow-hidden">
                    <h1 id="trackTitle" class="text-sm font-semibold truncate leading-tight tracking-wide text-white">Loading Playlist...</h1>
                    <p id="trackAuthor" class="text-xs text-gray-300/80 truncate mt-0.5">YouTube Audio Player</p>
                </div>
            </div>

            <button id="openSettingsBtn" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 transition text-white/80 hover:text-white flex-shrink-0" title="Widget Settings">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </div>

        <div class="relative z-10 my-auto">
            <div class="flex items-center justify-between text-[11px] text-gray-300 font-mono mb-1.5">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
            <input type="range" id="progressBar" min="0" max="100" value="0" class="w-full h-1.5 cursor-pointer">
        </div>

        <div class="relative z-10 flex items-center justify-between">
            <!-- Shuffle & Repeat Controls -->
            <div class="flex items-center gap-1.5">
                <button id="shuffleBtn" class="p-2 rounded-lg text-gray-400 hover:text-white transition active:scale-95" title="Shuffle">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                    </svg>
                </button>
                <button id="repeatBtn" class="p-2 rounded-lg text-gray-400 hover:text-white transition active:scale-95" title="Repeat">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>

            <!-- Main Playback Controls -->
            <div class="flex items-center gap-3">
                <!-- Previous Button -->
                <button id="prevBtn" class="p-2 text-white/80 hover:text-white transition active:scale-90" title="Previous Track">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>

                <!-- Primary Play/Pause Toggle Button (Clean SVG Toggle) -->
                <button id="playPauseBtn" class="w-11 h-11 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 active:scale-95 transition shadow-lg" title="Play/Pause">
                    <!-- Dynamic Play SVG Icon -->
                    <svg id="playIcon" class="w-5 h-5 fill-current translate-x-0.5" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <!-- Dynamic Pause SVG Icon -->
                    <svg id="pauseIcon" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>

                <!-- Next Button -->
                <button id="nextBtn" class="p-2 text-white/80 hover:text-white transition active:scale-90" title="Next Track">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>

            <!-- Volume Slider & Toggle -->
            <div class="flex items-center gap-1.5 w-24">
                <button id="muteBtn" class="p-1 text-gray-300 hover:text-white transition">
                    <svg id="volumeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"></path>
                    </svg>
                </button>
                <input type="range" id="volumeSlider" min="0" max="100" value="100" class="w-16 h-1 cursor-pointer">
            </div>
        </div>
    </div>

    <!-- Hidden YouTube API Iframe Player Container -->
    <div class="hidden">
        <div id="youtubePlayer"></div>
    </div>

    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-gray-900 border border-white/10 rounded-2xl w-full max-w-sm p-5 shadow-2xl flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
            
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <h2 class="text-sm font-bold tracking-wide uppercase text-gray-200 flex items-center gap-2">
                    <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    </svg>
                    Instance Settings
                </h2>
                <button id="closeSettingsBtn" class="text-gray-400 hover:text-white p-1 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- YouTube Playlist URL / ID Section -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-gray-300">YouTube Playlist URL or ID</label>
                <div class="flex gap-2">
                    <input type="text" id="playlistInput" placeholder="https://www.youtube.com/playlist?list=PL..." class="flex-1 bg-gray-800 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                    <button id="loadPlaylistBtn" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-xl text-xs font-semibold active:scale-95 transition">Load</button>
                </div>
                <p id="playlistStatus" class="text-[11px] text-emerald-400 hidden mt-0.5"></p>
            </div>

            <!-- Unique Instance ID Setting -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-gray-300">Unique Instance ID / Character</label>
                <div class="flex gap-2">
                    <input type="text" id="instanceIdInput" placeholder="e.g. character1" class="flex-1 bg-gray-800 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                    <button id="setInstanceBtn" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-2 rounded-xl text-xs font-medium transition">Set ID</button>
                </div>
            </div>

            <!-- Card Customization Section -->
            <div class="space-y-3 pt-2 border-t border-white/10">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-medium text-gray-300">Background Image / GIF URL</label>
                    <input type="text" id="bgImageInput" placeholder="https://example.com/image.gif" class="w-full bg-gray-800 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-medium text-gray-300">Overlay Opacity</label>
                        <input type="range" id="overlayOpacityInput" min="0" max="100" value="60" class="w-full h-1.5">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-medium text-gray-300">Accent Color</label>
                        <input type="color" id="accentColorInput" value="#a855f7" class="w-full h-8 bg-transparent rounded-lg cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Embed Code & Notion Export Section -->
            <div class="pt-3 border-t border-white/10 flex flex-col gap-2">
                <button id="copyNotionLinkBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2 active:scale-95 transition shadow-md">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                    </svg>
                    Copy Permanent Embed Link
                </button>
                <p id="copySuccessMsg" class="text-[10px] text-center text-emerald-400 hidden">Copied URL with full playlist URL to clipboard!</p>
            </div>
        </div>
    </div>

    <script>
        // Load YouTube IFrame API asynchronously
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Core Application State
        let player = null;
        let isPlaying = false;
        let updateTimer = null;
        let currentInstanceId = "default";
        let fullPlaylistUrl = "https://www.youtube.com/playlist?list=PLJYIXcNxi-qw";
        let extractedListId = "PLJYIXcNxi-qw";

        // Config defaults
        let config = {
            playlistUrl: fullPlaylistUrl,
            bgImage: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop",
            overlayOpacity: 60,
            accentColor: "#a855f7"
        };

        function parseQueryParameters() {
            const params = new URLSearchParams(window.location.search);
            
            // Handle instance ID parameter
            if (params.has('id')) {
                currentInstanceId = params.get('id').trim() || "default";
            }

            // Load stored config for this instance if present
            const storedConfig = localStorage.getItem(`yt_widget_config_${currentInstanceId}`);
            if (storedConfig) {
                try {
                    config = { ...config, ...JSON.parse(storedConfig) };
                } catch(e) { console.error("Error reading stored config", e); }
            }

            // URL params override saved settings if specified
            if (params.has('playlist')) {
                let p = params.get('playlist');
                if (p) {
                    config.playlistUrl = p;
                }
            }

            // Extract exact list ID from playlist URL or raw string
            extractedListId = extractListId(config.playlistUrl);
        }

        function extractListId(input) {
            if (!input) return "PLJYIXcNxi-qw";
            input = input.trim();
            
            // Check for list= parameter in URL
            if (input.includes('list=')) {
                try {
                    const match = input.match(/[?&]list=([^&]+)/);
                    if (match && match[1]) return match[1];
                } catch(e) {}
            }
            // Return raw string assuming it's already an ID
            return input;
        }

        function saveInstanceConfig() {
            localStorage.setItem(`yt_widget_config_${currentInstanceId}`, JSON.stringify(config));
        }

        function applyVisualTheme() {
            const playerCard = document.getElementById('playerCard');
            const cardOverlay = document.getElementById('cardOverlay');
            const accentBadge = document.getElementById('accentBadge');
            const playPauseBtn = document.getElementById('playPauseBtn');

            if (config.bgImage) {
                playerCard.style.backgroundImage = `url('${config.bgImage}')`;
            } else {
                playerCard.style.backgroundImage = 'none';
            }

            cardOverlay.style.opacity = (config.overlayOpacity / 100).toString();
            accentBadge.style.backgroundColor = config.accentColor;
            document.documentElement.style.setProperty('--accent-color', config.accentColor);

            // Sync inputs in modal
            document.getElementById('playlistInput').value = config.playlistUrl;
            document.getElementById('instanceIdInput').value = currentInstanceId;
            document.getElementById('bgImageInput').value = config.bgImage || "";
            document.getElementById('overlayOpacityInput').value = config.overlayOpacity;
            document.getElementById('accentColorInput').value = config.accentColor;
        }

        function onYouTubeIframeAPIReady() {
            parseQueryParameters();
            applyVisualTheme();

            player = new YT.Player('youtubePlayer', {
                height: '0',
                width: '0',
                playerVars: {
                    'listType': 'playlist',
                    'list': extractedListId,
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            updateTrackInfo();
            startProgressLoop();
        }

        function onPlayerError(event) {
            document.getElementById('trackTitle').textContent = "Unable to load playlist";
            document.getElementById('trackAuthor').textContent = "Check URL or Video Availability";
        }

        function setPlayPauseUI(playing) {
            isPlaying = playing;
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');

            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function onPlayerStateChange(event) {
            // YT.PlayerState: PLAYING (1), PAUSED (2), BUFFERING (3), CUED (5)
            if (event.data === YT.PlayerState.PLAYING) {
                setPlayPauseUI(true);
                updateTrackInfo();
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                setPlayPauseUI(false);
            }
        }

        function togglePlayPause() {
            if (!player) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function updateTrackInfo() {
            if (!player || !player.getVideoData) return;
            const data = player.getVideoData();
            if (data && data.title) {
                document.getElementById('trackTitle').textContent = data.title;
                document.getElementById('trackAuthor').textContent = data.author || "YouTube Music";
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function startProgressLoop() {
            if (updateTimer) clearInterval(updateTimer);
            
            updateTimer = setInterval(() => {
                if (!player || typeof player.getCurrentTime !== 'function') return;

                const currentTime = player.getCurrentTime() || 0;
                const duration = player.getDuration() || 0;

                document.getElementById('currentTime').textContent = formatTime(currentTime);
                document.getElementById('durationTime').textContent = formatTime(duration);

                const progressBar = document.getElementById('progressBar');
                if (duration > 0) {
                    progressBar.value = (currentTime / duration) * 100;
                } else {
                    progressBar.value = 0;
                }

                // Periodic title refresh
                if (isPlaying) {
                    updateTrackInfo();
                }
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Controls
            document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);
            
            document.getElementById('nextBtn').addEventListener('click', () => {
                if (player && player.nextVideo) player.nextVideo();
            });

            document.getElementById('prevBtn').addEventListener('click', () => {
                if (player && player.previousVideo) player.previousVideo();
            });

            // Progress bar scrubbing
            document.getElementById('progressBar').addEventListener('input', (e) => {
                if (!player || typeof player.getDuration !== 'function') return;
                const duration = player.getDuration();
                if (duration > 0) {
                    const targetTime = (e.target.value / 100) * duration;
                    player.seekTo(targetTime, true);
                }
            });

            // Volume Controls
            const volumeSlider = document.getElementById('volumeSlider');
            volumeSlider.addEventListener('input', (e) => {
                if (!player) return;
                const vol = parseInt(e.target.value, 10);
                player.setVolume(vol);
                if (vol === 0) {
                    player.mute();
                } else {
                    player.unMute();
                }
            });

            document.getElementById('muteBtn').addEventListener('click', () => {
                if (!player) return;
                if (player.isMuted()) {
                    player.unMute();
                    volumeSlider.value = player.getVolume() || 100;
                } else {
                    player.mute();
                    volumeSlider.value = 0;
                }
            });

            // Settings Modal Toggles
            const modal = document.getElementById('settingsModal');
            document.getElementById('openSettingsBtn').addEventListener('click', () => {
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            });

            document.getElementById('closeSettingsBtn').addEventListener('click', () => {
                modal.classList.add('opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 200);
            });

            // Playlist URL Load
            document.getElementById('loadPlaylistBtn').addEventListener('click', () => {
                const inputVal = document.getElementById('playlistInput').value.trim();
                if (!inputVal) return;

                config.playlistUrl = inputVal;
                extractedListId = extractListId(inputVal);
                saveInstanceConfig();

                if (player && player.loadPlaylist) {
                    player.loadPlaylist({
                        listType: 'playlist',
                        list: extractedListId
                    });
                    
                    const statusMsg = document.getElementById('playlistStatus');
                    statusMsg.textContent = "Loaded! Copy link below into Notion.";
                    statusMsg.classList.remove('hidden');
                    setTimeout(() => statusMsg.classList.add('hidden'), 4000);
                }
            });

            // Set Instance ID Button
            document.getElementById('setInstanceBtn').addEventListener('click', () => {
                const newId = document.getElementById('instanceIdInput').value.trim();
                if (newId) {
                    currentInstanceId = newId;
                    saveInstanceConfig();
                    alert(`Instance ID set to '${currentInstanceId}'`);
                }
            });

            // Live Customization Listeners
            document.getElementById('bgImageInput').addEventListener('input', (e) => {
                config.bgImage = e.target.value.trim();
                applyVisualTheme();
                saveInstanceConfig();
            });

            document.getElementById('overlayOpacityInput').addEventListener('input', (e) => {
                config.overlayOpacity = e.target.value;
                applyVisualTheme();
                saveInstanceConfig();
            });

            document.getElementById('accentColorInput').addEventListener('input', (e) => {
                config.accentColor = e.target.value;
                applyVisualTheme();
                saveInstanceConfig();
            });

            document.getElementById('copyNotionLinkBtn').addEventListener('click', () => {
                const baseUrl = window.location.origin + window.location.pathname;
                
                // Construct link using full URL encoding
                const encodedPlaylistUrl = encodeURIComponent(config.playlistUrl);
                const finalUrl = `${baseUrl}?playlist=${encodedPlaylistUrl}&id=${encodeURIComponent(currentInstanceId)}`;

                // Copy to clipboard
                const tempInput = document.createElement('input');
                tempInput.value = finalUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);

                const copyMsg = document.getElementById('copySuccessMsg');
                copyMsg.classList.remove('hidden');
                setTimeout(() => copyMsg.classList.add('hidden'), 3500);
            });
        });
    </script>
</body>
</html>
