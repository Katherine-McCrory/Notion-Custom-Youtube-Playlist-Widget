<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion YouTube Music Widget</title>
  
  <!-- Force dark color scheme to prevent Notion's iframe white background canvas -->
  <meta name="color-scheme" content="dark">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  
  <style>
    /* Complete canvas & page background removal for Notion embeds */
    :root, html, body {
      background-color: transparent !important;
      background: transparent !important;
      color-scheme: dark !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    /* Custom Marquee animation for long song titles */
    .marquee-container {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .marquee-content {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 12s linear infinite;
    }
    .marquee-container:hover .marquee-content {
      animation-play-state: paused;
    }
    @keyframes marquee {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    /* Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      height: 6px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: var(--accent-color, #8b5cf6);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Glassmorphism card default styles */
    .widget-card {
      background-color: var(--card-bg, rgba(15, 23, 42, 0.85));
      backdrop-filter: blur(var(--card-blur, 12px));
      -webkit-backdrop-filter: blur(var(--card-blur, 12px));
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Hidden YouTube iframe player */
    #yt-player-frame {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 select-none">

  <!-- Main Widget Container -->
  <div id="widget" class="widget-card relative w-full max-w-md rounded-2xl p-4 shadow-2xl text-white transition-all duration-300 overflow-hidden">
    
    <!-- Custom Background Image/GIF Layer -->
    <div id="bg-overlay" class="absolute inset-0 bg-cover bg-center pointer-events-none transition-opacity duration-300 opacity-0" style="z-index: 0;"></div>
    <div id="bg-dim" class="absolute inset-0 bg-black/40 pointer-events-none transition-opacity duration-300 opacity-0" style="z-index: 1;"></div>

    <!-- Content Wrapper -->
    <div class="relative z-10 flex flex-col gap-3">
      
      <!-- Top Bar: Status & Settings Button -->
      <div class="flex items-center justify-between text-xs text-white/70">
        <div class="flex items-center gap-2">
          <i class="fa-brands fa-youtube text-red-500 text-sm"></i>
          <span id="player-status" class="font-medium tracking-wide">Ready</span>
        </div>
        <button id="settings-toggle" class="hover:text-white transition-colors p-1" title="Widget Settings">
          <i class="fa-solid fa-sliders text-sm"></i>
        </button>
      </div>

      <!-- Main Track Info Box -->
      <div class="flex items-center gap-3">
        <!-- Thumbnail -->
        <div class="relative group w-14 h-14 flex-shrink-0 rounded-xl overflow-hidden bg-black/40 border border-white/10 shadow-inner">
          <img id="track-thumb" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150&auto=format&fit=crop&q=80" alt="Thumbnail" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
        </div>

        <!-- Track Title & Channel -->
        <div class="flex-1 min-w-0">
          <div class="marquee-container w-full">
            <h1 id="track-title" class="marquee-content font-bold text-sm text-white">Select or Load a Playlist</h1>
          </div>
          <p id="track-author" class="text-xs text-white/60 truncate mt-0.5">YouTube Music</p>
        </div>
      </div>

      <!-- Scrubber Progress Bar -->
      <div class="space-y-1">
        <input type="range" id="progress-bar" min="0" max="100" value="0" class="w-full cursor-pointer">
        <div class="flex justify-between text-[10px] text-white/50 font-mono">
          <span id="curr-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
      </div>

      <!-- Playback Controls -->
      <div class="flex items-center justify-between pt-1">
        <!-- Volume Control -->
        <div class="flex items-center gap-2 w-28">
          <button id="mute-btn" class="text-white/70 hover:text-white transition-colors">
            <i id="volume-icon" class="fa-solid fa-volume-high text-xs"></i>
          </button>
          <input type="range" id="volume-slider" min="0" max="100" value="80" class="w-full">
        </div>

        <!-- Center Buttons: Prev, Play/Pause, Next -->
        <div class="flex items-center gap-3">
          <button id="prev-btn" class="text-white/70 hover:text-white transition-colors text-sm p-1">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          <button id="play-btn" class="w-10 h-10 rounded-full bg-violet-600 text-white flex items-center justify-center hover:scale-105 transition-all shadow-lg shadow-violet-600/30">
            <i id="play-icon" class="fa-solid fa-play text-sm translate-x-0.5"></i>
          </button>
          <button id="next-btn" class="text-white/70 hover:text-white transition-colors text-sm p-1">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

        <!-- Shuffle Toggle -->
        <button id="shuffle-btn" class="text-white/40 hover:text-white transition-colors text-xs p-1" title="Shuffle Playlist">
          <i class="fa-solid fa-shuffle"></i>
        </button>
      </div>
    </div>

    <!-- Settings Drawer Overlay -->
    <div id="settings-panel" class="absolute inset-0 z-20 bg-slate-900/95 backdrop-blur-md p-4 flex flex-col justify-between transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
      <div>
        <div class="flex items-center justify-between border-b border-white/10 pb-2 mb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-white/80"><i class="fa-solid fa-gear mr-1.5"></i> Widget Settings</h2>
          <button id="close-settings" class="text-white/60 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="space-y-3 text-xs overflow-y-auto max-h-52 pr-1">
          <!-- Playlist URL/ID Input -->
          <div>
            <label class="block text-white/70 mb-1">YouTube Playlist ID or URL</label>
            <div class="flex gap-1.5">
              <input type="text" id="playlist-input" placeholder="PL... or YouTube URL" class="flex-1 bg-black/40 border border-white/10 rounded-lg px-2.5 py-1.5 text-white placeholder-white/30 focus:outline-none focus:border-violet-500">
              <button id="load-playlist-btn" class="bg-violet-600 hover:bg-violet-500 px-3 py-1.5 rounded-lg font-medium text-white transition-colors">Load</button>
            </div>
          </div>

          <!-- Color Theme Settings -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-white/70 mb-1">Card Color</label>
              <input type="color" id="card-color-picker" value="#0f172a" class="w-full h-8 rounded border-0 bg-transparent cursor-pointer">
            </div>
            <div>
              <label class="block text-white/70 mb-1">Accent Color</label>
              <input type="color" id="accent-color-picker" value="#8b5cf6" class="w-full h-8 rounded border-0 bg-transparent cursor-pointer">
            </div>
          </div>

          <!-- Glassmorphism Blur Slider -->
          <div>
            <div class="flex justify-between text-white/70 mb-1">
              <span>Card Opacity</span>
              <span id="opacity-val">85%</span>
            </div>
            <input type="range" id="card-opacity" min="10" max="100" value="85" class="w-full">
          </div>

          <!-- Background Image / GIF URL -->
          <div>
            <label class="block text-white/70 mb-1">Background Image/GIF URL</label>
            <input type="text" id="bg-url-input" placeholder="https://... image/gif" class="w-full bg-black/40 border border-white/10 rounded-lg px-2.5 py-1.5 text-white placeholder-white/30 focus:outline-none focus:border-violet-500">
          </div>
        </div>
      </div>

      <p class="text-[10px] text-white/40 text-center pt-2">Settings automatically save in browser</p>
    </div>
  </div>

  <!-- Hidden YouTube Player Container -->
  <div id="yt-player-frame"></div>

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  
  <script>
    let player = null;
    let isPlaying = false;
    let isMuted = false;
    let isShuffle = false;
    let updateTimer = null;
    let currentPlaylistId = 'PL4fGSI1pTjv1-0m-9Z-9vXN-U9j_o9z-A'; // Default lo-fi playlist ID

    // Load saved settings from LocalStorage
    function loadSavedSettings() {
      const savedCardColor = localStorage.getItem('yt_card_color') || '#0f172a';
      const savedAccentColor = localStorage.getItem('yt_accent_color') || '#8b5cf6';
      const savedOpacity = localStorage.getItem('yt_card_opacity') || '85';
      const savedBgUrl = localStorage.getItem('yt_bg_url') || '';
      const savedPlaylist = localStorage.getItem('yt_playlist_id') || currentPlaylistId;

      document.getElementById('card-color-picker').value = savedCardColor;
      document.getElementById('accent-color-picker').value = savedAccentColor;
      document.getElementById('card-opacity').value = savedOpacity;
      document.getElementById('bg-url-input').value = savedBgUrl;
      document.getElementById('playlist-input').value = savedPlaylist;

      currentPlaylistId = savedPlaylist;
      applyTheme(savedCardColor, savedAccentColor, savedOpacity, savedBgUrl);
    }

    function applyTheme(cardHex, accentHex, opacity, bgUrl) {
      document.documentElement.style.setProperty('--accent-color', accentHex);
      
      // Convert Hex to RGBA for card background opacity
      const r = parseInt(cardHex.slice(1, 3), 16);
      const g = parseInt(cardHex.slice(3, 5), 16);
      const b = parseInt(cardHex.slice(5, 7), 16);
      const rgba = `rgba(${r}, ${g}, ${b}, ${opacity / 100})`;
      document.documentElement.style.setProperty('--card-bg', rgba);

      // Play button color update
      const playBtn = document.getElementById('play-btn');
      playBtn.style.backgroundColor = accentHex;
      playBtn.style.boxShadow = `0 10px 15px -3px ${accentHex}50`;

      // Background Image/GIF
      const bgOverlay = document.getElementById('bg-overlay');
      const bgDim = document.getElementById('bg-dim');
      if (bgUrl && bgUrl.trim() !== '') {
        bgOverlay.style.backgroundImage = `url('${bgUrl.trim()}')`;
        bgOverlay.style.opacity = '1';
        bgDim.style.opacity = '1';
      } else {
        bgOverlay.style.opacity = '0';
        bgDim.style.opacity = '0';
      }
    }

    // Initialize YouTube Player
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player-frame', {
        height: '200',
        width: '200',
        playerVars: {
          listType: 'playlist',
          list: currentPlaylistId,
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      document.getElementById('player-status').textContent = 'Ready';
      updateTrackInfo();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('play-icon').className = 'fa-solid fa-pause text-sm';
        document.getElementById('player-status').textContent = 'Now Playing';
        startTimer();
      } else {
        isPlaying = false;
        document.getElementById('play-icon').className = 'fa-solid fa-play text-sm translate-x-0.5';
        document.getElementById('player-status').textContent = event.data === YT.PlayerState.PAUSED ? 'Paused' : 'Ready';
        stopTimer();
      }
      updateTrackInfo();
    }

    function updateTrackInfo() {
      if (!player || typeof player.getVideoData !== 'function') return;
      const data = player.getVideoData();
      if (data && data.title) {
        document.getElementById('track-title').textContent = data.title;
        document.getElementById('track-author').textContent = data.author || 'YouTube Music';
        const videoId = data.video_id;
        if (videoId) {
          document.getElementById('track-thumb').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
        }
      }
    }

    function startTimer() {
      stopTimer();
      updateTimer = setInterval(() => {
        if (!player || !isPlaying) return;
        const current = player.getCurrentTime() || 0;
        const total = player.getDuration() || 0;
        document.getElementById('curr-time').textContent = formatTime(current);
        document.getElementById('total-time').textContent = formatTime(total);
        if (total > 0) {
          document.getElementById('progress-bar').value = (current / total) * 100;
        }
      }, 500);
    }

    function stopTimer() {
      if (updateTimer) clearInterval(updateTimer);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Extract Playlist ID from full URL or return ID as is
    function extractPlaylistId(input) {
      if (input.includes('list=')) {
        const matches = input.match(/[&?]list=([^&]+)/);
        return matches ? matches[1] : input;
      }
      return input.trim();
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      loadSavedSettings();

      // Settings Panel Controls
      const settingsPanel = document.getElementById('settings-panel');
      document.getElementById('settings-toggle').addEventListener('click', () => {
        settingsPanel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      });
      document.getElementById('close-settings').addEventListener('click', () => {
        settingsPanel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      });

      // Play / Pause Toggle
      document.getElementById('play-btn').addEventListener('click', () => {
        if (!player) return;
        if (isPlaying) {
          player.pauseVideo();
        } else {
          player.playVideo();
        }
      });

      // Track Navigation
      document.getElementById('next-btn').addEventListener('click', () => player && player.nextVideo());
      document.getElementById('prev-btn').addEventListener('click', () => player && player.previousVideo());

      // Shuffle Toggle
      document.getElementById('shuffle-btn').addEventListener('click', () => {
        if (!player) return;
        isShuffle = !isShuffle;
        player.setShuffle(isShuffle);
        document.getElementById('shuffle-btn').classList.toggle('text-violet-400', isShuffle);
        document.getElementById('shuffle-btn').classList.toggle('text-white/40', !isShuffle);
      });

      // Volume Controls
      document.getElementById('volume-slider').addEventListener('input', (e) => {
        if (!player) return;
        const val = e.target.value;
        player.setVolume(val);
        const icon = document.getElementById('volume-icon');
        if (val == 0) {
          icon.className = 'fa-solid fa-volume-xmark text-xs text-red-400';
        } else if (val < 50) {
          icon.className = 'fa-solid fa-volume-low text-xs';
        } else {
          icon.className = 'fa-solid fa-volume-high text-xs';
        }
      });

      // Scrubber Progress Seek
      document.getElementById('progress-bar').addEventListener('input', (e) => {
        if (!player) return;
        const total = player.getDuration() || 0;
        const seekTo = (e.target.value / 100) * total;
        player.seekTo(seekTo, true);
      });

      // Theme Customization Listeners
      const updateThemeFromInputs = () => {
        const cardColor = document.getElementById('card-color-picker').value;
        const accentColor = document.getElementById('accent-color-picker').value;
        const opacity = document.getElementById('card-opacity').value;
        const bgUrl = document.getElementById('bg-url-input').value;

        document.getElementById('opacity-val').textContent = `${opacity}%`;
        applyTheme(cardColor, accentColor, opacity, bgUrl);

        localStorage.setItem('yt_card_color', cardColor);
        localStorage.setItem('yt_accent_color', accentColor);
        localStorage.setItem('yt_card_opacity', opacity);
        localStorage.setItem('yt_bg_url', bgUrl);
      };

      document.getElementById('card-color-picker').addEventListener('input', updateThemeFromInputs);
      document.getElementById('accent-color-picker').addEventListener('input', updateThemeFromInputs);
      document.getElementById('card-opacity').addEventListener('input', updateThemeFromInputs);
      document.getElementById('bg-url-input').addEventListener('input', updateThemeFromInputs);

      // Load Playlist Button
      document.getElementById('load-playlist-btn').addEventListener('click', () => {
        const rawInput = document.getElementById('playlist-input').value;
        const cleanPlaylistId = extractPlaylistId(rawInput);
        if (cleanPlaylistId && player) {
          currentPlaylistId = cleanPlaylistId;
          localStorage.setItem('yt_playlist_id', currentPlaylistId);
          player.loadPlaylist({ listType: 'playlist', list: currentPlaylistId });
          settingsPanel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
        }
      });
    });
  </script>
</body>
</html>
