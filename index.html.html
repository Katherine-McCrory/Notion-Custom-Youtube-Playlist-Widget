<!DOCTYPE html>
<html lang="en" style="background: transparent !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion YouTube Music Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        /* Force root html & body to be 100% transparent for Notion embeds */
        html, body {
            background: transparent !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        :root {
            --card-bg-color: #0f172a;
            --accent-color: #6366f1;
            --text-color: #ffffff;
            --subtext-color: rgba(255, 255, 255, 0.7);
            --border-color: rgba(255, 255, 255, 0.15);
            --control-hover: rgba(255, 255, 255, 0.1);
        }

        .accent-bg { background-color: var(--accent-color) !important; }
        .accent-text { color: var(--accent-color) !important; }

        /* Custom Scrubber Track Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            border-radius: 9999px;
            background: rgba(150, 150, 150, 0.3);
        }

        input[type=range]::-webkit-slider-thumb {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -4px;
            transition: transform 0.1s ease;
            box-shadow: 0 0 6px rgba(0,0,0,0.2);
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        /* Marquee horizontal auto scroll for track titles */
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
        }

        .scroll-text {
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(150, 150, 150, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-2">

    <div id="player-card" 
         class="relative w-full max-w-xl rounded-2xl overflow-hidden shadow-2xl p-3.5 border transition-all duration-300 flex flex-col gap-2.5"
         style="background-color: var(--card-bg-color); color: var(--text-color); border-color: var(--border-color); background-size: cover; background-position: center;">
        
        <!-- Optional Background Image Layer with Adjustable Tint -->
        <div id="bg-image-layer" class="absolute inset-0 z-0 bg-cover bg-center pointer-events-none hidden"></div>
        <div id="bg-overlay-layer" class="absolute inset-0 z-0 pointer-events-none hidden"></div>

        <!-- Hidden YouTube API Target -->
        <div class="hidden">
            <div id="youtube-player"></div>
        </div>

        <!-- Card Interactive Foreground Content -->
        <div class="relative z-10 flex flex-col gap-2.5">
            
            <!-- Top Row: Track Thumbnail, Title, and Drawer Settings Toggle -->
            <div class="flex items-center justify-between gap-3">
                
                <!-- Track Details -->
                <div class="flex items-center gap-3 overflow-hidden flex-1 min-w-0">
                    <div class="relative w-10 h-10 rounded-lg overflow-hidden bg-black/20 flex-shrink-0 border border-white/10 shadow-inner flex items-center justify-center">
                        <img id="track-thumb" src="" alt="" class="w-full h-full object-cover hidden">
                        <i id="track-icon" class="fa-solid fa-music text-xs opacity-60"></i>
                    </div>

                    <div class="flex flex-col min-w-0 flex-1">
                        <div class="marquee-container w-full">
                            <div id="marquee-wrapper" class="marquee-content">
                                <span id="track-title" class="text-xs font-semibold tracking-tight drop-shadow-sm">
                                    Initializing Player...
                                </span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 mt-0.5">
                            <span id="status-badge" class="text-[10px] font-medium px-1.5 py-0.2 rounded bg-black/20 opacity-80 border border-white/10">
                                Ready
                            </span>
                            <span id="time-display" class="text-[11px] opacity-75 font-mono">
                                0:00 / 0:00
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Settings Button Toggle -->
                <div class="flex items-center gap-1">
                    <button id="settings-toggle" class="p-2 rounded-lg hover:bg-black/10 transition-colors" title="Customize Background & Playlist">
                        <i class="fa-solid fa-sliders text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Scrubber Track Slider -->
            <div class="flex items-center gap-2 w-full pt-0.5">
                <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1" class="w-full">
            </div>

            <!-- Bottom Row: Volume Controls, Audio Buttons, and Shuffle Toggle -->
            <div class="flex items-center justify-between pt-0.5">
                <!-- Volume Controls -->
                <div class="flex items-center gap-1.5">
                    <button id="mute-btn" class="p-1 opacity-80 hover:opacity-100 transition-opacity">
                        <i id="volume-icon" class="fa-solid fa-volume-high text-xs"></i>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="100" value="100" class="w-14 sm:w-18 accent-bg">
                </div>

                <!-- Center Audio Control Buttons -->
                <div class="flex items-center gap-2.5">
                    <button id="prev-btn" class="p-1.5 rounded-full hover:bg-black/10 transition-all active:scale-95" title="Previous Track">
                        <i class="fa-solid fa-backward-step text-xs"></i>
                    </button>

                    <button id="play-btn" class="w-9 h-9 rounded-full accent-bg text-white flex items-center justify-center shadow-lg hover:opacity-90 transition-all active:scale-95" title="Play/Pause">
                        <i id="play-icon" class="fa-solid fa-play text-xs ml-0.5"></i>
                    </button>

                    <button id="next-btn" class="p-1.5 rounded-full hover:bg-black/10 transition-all active:scale-95" title="Next Track">
                        <i class="fa-solid fa-forward-step text-xs"></i>
                    </button>
                </div>

                <!-- Shuffle Toggle -->
                <div class="flex items-center gap-1.5">
                    <button id="shuffle-btn" class="p-1 opacity-50 hover:opacity-100 transition-opacity" title="Shuffle Playlist">
                        <i class="fa-solid fa-shuffle text-xs"></i>
                    </button>
                </div>
            </div>

            <div id="settings-drawer" class="hidden mt-2 pt-3 border-t border-black/10 flex flex-col gap-3 text-xs max-h-56 overflow-y-auto pr-1">
                
                <!-- Card Background & Accent Color Pickers -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-semibold uppercase tracking-wider mb-1 opacity-70">Solid Card Background</label>
                        <div class="flex items-center gap-2 bg-black/10 p-1.5 rounded-lg border border-black/10">
                            <input type="color" id="bg-color-picker" value="#0f172a" class="w-6 h-6 rounded cursor-pointer border-0 bg-transparent">
                            <span id="bg-color-val" class="font-mono text-[11px] opacity-90">#0f172a</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold uppercase tracking-wider mb-1 opacity-70">Accent Button Color</label>
                        <div class="flex items-center gap-2 bg-black/10 p-1.5 rounded-lg border border-black/10">
                            <input type="color" id="accent-color-picker" value="#6366f1" class="w-6 h-6 rounded cursor-pointer border-0 bg-transparent">
                            <span id="accent-color-val" class="font-mono text-[11px] opacity-90">#6366f1</span>
                        </div>
                    </div>
                </div>

                <!-- Custom Background Image Option -->
                <div class="flex flex-col gap-1.5">
                    <label class="block text-[10px] font-semibold uppercase tracking-wider opacity-70">Optional Image / GIF Background</label>
                    <div class="flex gap-2">
                        <input type="text" id="bg-url-input" placeholder="Paste Image URL..." class="flex-1 bg-black/10 border border-black/10 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:border-black/30">
                        <label class="px-2.5 py-1 bg-black/10 hover:bg-black/20 rounded-lg cursor-pointer transition-colors flex items-center gap-1 text-[11px]">
                            <i class="fa-solid fa-upload text-[10px]"></i>
                            <span>Upload</span>
                            <input type="file" id="bg-file-input" accept="image/*" class="hidden">
                        </label>
                        <button id="remove-bg-btn" class="px-2 py-1 bg-red-500/20 hover:bg-red-500/40 text-red-500 rounded-lg transition-colors text-[11px]" title="Clear Image">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>

                <!-- Overlay Tint & Blur (Only for image mode) -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-semibold uppercase tracking-wider mb-1 opacity-70">Image Dim Tint</label>
                        <input type="range" id="overlay-opacity" min="0" max="0.9" step="0.05" value="0.3" class="w-full">
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold uppercase tracking-wider mb-1 opacity-70">Image Blur</label>
                        <input type="range" id="overlay-blur" min="0" max="20" step="1" value="0" class="w-full">
                    </div>
                </div>

                <!-- YouTube Playlist Switcher Input -->
                <div class="flex flex-col gap-1 pt-1 border-t border-black/10">
                    <label class="block text-[10px] font-semibold uppercase tracking-wider opacity-70">YouTube Playlist URL or ID</label>
                    <div class="flex gap-2">
                        <input type="text" id="playlist-input" placeholder="e.g. PLJYIXcNxi-qw" class="flex-1 bg-black/10 border border-black/10 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:border-black/30">
                        <button id="save-playlist-btn" class="px-3 py-1 accent-bg text-white font-semibold rounded-lg hover:opacity-90 transition-opacity text-xs">
                            Load
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // App State
        let currentPlaylistId = 'PLJYIXcNxi-qw';
        let player = null;
        let isPlaying = false;
        let isMuted = false;
        let updateInterval = null;
        let isDraggingScrubber = false;
        let isApiReady = false;

        const defaultPrefs = {
            bgColor: '#0f172a',
            accentColor: '#6366f1',
            bgImage: '',
            overlayOpacity: 0.3,
            overlayBlur: 0,
            playlistId: 'PLJYIXcNxi-qw'
        };

        let prefs = { ...defaultPrefs };

        // DOM Elements
        const playerCard = document.getElementById('player-card');
        const bgImageLayer = document.getElementById('bg-image-layer');
        const bgOverlayLayer = document.getElementById('bg-overlay-layer');
        
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const trackTitle = document.getElementById('track-title');
        const trackThumb = document.getElementById('track-thumb');
        const trackIcon = document.getElementById('track-icon');
        const statusBadge = document.getElementById('status-badge');
        const progressBar = document.getElementById('progress-bar');
        const timeDisplay = document.getElementById('time-display');
        const muteBtn = document.getElementById('mute-btn');
        const volumeIcon = document.getElementById('volume-icon');
        const volumeSlider = document.getElementById('volume-slider');
        const shuffleBtn = document.getElementById('shuffle-btn');

        const settingsToggle = document.getElementById('settings-toggle');
        const settingsDrawer = document.getElementById('settings-drawer');
        const bgColorPicker = document.getElementById('bg-color-picker');
        const bgColorVal = document.getElementById('bg-color-val');
        const accentColorPicker = document.getElementById('accent-color-picker');
        const accentColorVal = document.getElementById('accent-color-val');
        const bgUrlInput = document.getElementById('bg-url-input');
        const bgFileInput = document.getElementById('bg-file-input');
        const removeBgBtn = document.getElementById('remove-bg-btn');
        const overlayOpacitySlider = document.getElementById('overlay-opacity');
        const overlayBlurSlider = document.getElementById('overlay-blur');
        const playlistInput = document.getElementById('playlist-input');
        const savePlaylistBtn = document.getElementById('save-playlist-btn');

        function getLuminance(hex) {
            let color = hex.replace('#', '');
            if (color.length === 3) {
                color = color.split('').map(c => c + c).join('');
            }
            const num = parseInt(color, 16);
            const r = (num >> 16) & 255;
            const g = (num >> 8) & 255;
            const b = num & 255;
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        function loadPreferences() {
            try {
                const saved = localStorage.getItem('notion_yt_player_prefs');
                if (saved) {
                    prefs = { ...defaultPrefs, ...JSON.parse(saved) };
                }
            } catch (e) {
                console.warn('LocalStorage unavailable:', e);
            }

            currentPlaylistId = prefs.playlistId || 'PLJYIXcNxi-qw';
            applyPreferences();
        }

        function savePreferences() {
            try {
                localStorage.setItem('notion_yt_player_prefs', JSON.stringify(prefs));
            } catch (e) {
                console.warn('LocalStorage save error:', e);
            }
        }

        // Apply Preferences directly to card styling
        function applyPreferences() {
            document.documentElement.style.setProperty('--accent-color', prefs.accentColor);

            bgColorPicker.value = prefs.bgColor;
            bgColorVal.innerText = prefs.bgColor;
            accentColorPicker.value = prefs.accentColor;
            accentColorVal.innerText = prefs.accentColor;
            overlayOpacitySlider.value = prefs.overlayOpacity;
            overlayBlurSlider.value = prefs.overlayBlur;

            if (prefs.bgImage) {
                // Image Background Mode
                bgImageLayer.style.backgroundImage = `url('${prefs.bgImage}')`;
                bgImageLayer.classList.remove('hidden');
                bgOverlayLayer.classList.remove('hidden');
                bgOverlayLayer.style.backgroundColor = 'rgba(0,0,0,' + prefs.overlayOpacity + ')';
                bgOverlayLayer.style.backdropFilter = `blur(${prefs.overlayBlur}px)`;
                bgOverlayLayer.style.webkitBackdropFilter = `blur(${prefs.overlayBlur}px)`;
                bgUrlInput.value = prefs.bgImage.startsWith('data:') ? '' : prefs.bgImage;

                // Force white text on image backgrounds
                document.documentElement.style.setProperty('--text-color', '#ffffff');
                document.documentElement.style.setProperty('--border-color', 'rgba(255, 255, 255, 0.2)');
            } else {
                // Pure Solid Color Mode
                bgImageLayer.classList.add('hidden');
                bgOverlayLayer.classList.add('hidden');
                playerCard.style.backgroundColor = prefs.bgColor;
                bgUrlInput.value = '';

                // Calculate Luminance to set high contrast text automatically
                const isLight = getLuminance(prefs.bgColor) > 0.5;
                if (isLight) {
                    document.documentElement.style.setProperty('--text-color', '#0f172a');
                    document.documentElement.style.setProperty('--border-color', 'rgba(15, 23, 42, 0.15)');
                } else {
                    document.documentElement.style.setProperty('--text-color', '#ffffff');
                    document.documentElement.style.setProperty('--border-color', 'rgba(255, 255, 255, 0.15)');
                }
            }

            playlistInput.value = currentPlaylistId;
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            isApiReady = true;
            initializePlayer();
        }

        function initializePlayer() {
            if (!isApiReady) return;

            let safeOrigin = 'https://www.youtube.com';
            try {
                if (window.location.origin && window.location.origin !== 'null') {
                    safeOrigin = window.location.origin;
                }
            } catch (e) {}

            if (player) {
                try { player.destroy(); } catch (e) {}
            }

            statusBadge.innerText = "Loading...";
            trackTitle.innerText = "Loading YouTube Playlist...";

            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                host: 'https://www.youtube-nocookie.com',
                playerVars: {
                    'listType': 'playlist',
                    'list': currentPlaylistId,
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'origin': safeOrigin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady() {
            statusBadge.innerText = "Ready";
            updateTrackInfo();
            startProgressLoop();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause text-xs";
                statusBadge.innerText = "Playing";
                updateTrackInfo();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                playIcon.className = "fa-solid fa-play text-xs ml-0.5";
                statusBadge.innerText = "Paused";
            } else if (event.data === YT.PlayerState.BUFFERING) {
                statusBadge.innerText = "Buffering";
            } else if (event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                playIcon.className = "fa-solid fa-play text-xs ml-0.5";
                statusBadge.innerText = "Ended";
            }
        }

        function onPlayerError(e) {
            console.warn('YouTube Player Error code:', e.data);
            statusBadge.innerText = "Error";
            trackTitle.innerText = "Track or playlist unavailable";
        }

        function updateTrackInfo() {
            if (!player || typeof player.getVideoData !== 'function') return;

            const videoData = player.getVideoData();
            if (videoData && videoData.title) {
                trackTitle.innerText = videoData.title;
                
                if (videoData.video_id) {
                    trackThumb.src = `https://img.youtube.com/vi/${videoData.video_id}/mqdefault.jpg`;
                    trackThumb.classList.remove('hidden');
                    trackIcon.classList.add('hidden');
                }

                const containerWidth = document.querySelector('.marquee-container').clientWidth;
                if (trackTitle.scrollWidth > containerWidth) {
                    trackTitle.parentElement.classList.add('scroll-text');
                } else {
                    trackTitle.parentElement.classList.remove('scroll-text');
                }
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function startProgressLoop() {
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                if (player && typeof player.getCurrentTime === 'function' && !isDraggingScrubber) {
                    const currentTime = player.getCurrentTime() || 0;
                    const duration = player.getDuration() || 0;

                    if (duration > 0) {
                        const progress = (currentTime / duration) * 100;
                        progressBar.value = progress;
                        timeDisplay.innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
                    } else {
                        timeDisplay.innerText = "0:00 / 0:00";
                    }
                }
            }, 500);
        }

        playBtn.addEventListener('click', () => {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (player && typeof player.nextVideo === 'function') {
                player.nextVideo();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (player && typeof player.previousVideo === 'function') {
                player.previousVideo();
            }
        });

        progressBar.addEventListener('mousedown', () => { isDraggingScrubber = true; });
        progressBar.addEventListener('mouseup', () => { isDraggingScrubber = false; });
        progressBar.addEventListener('change', () => {
            if (player && typeof player.getDuration === 'function') {
                const duration = player.getDuration();
                const seekToTime = (progressBar.value / 100) * duration;
                player.seekTo(seekToTime, true);
            }
            isDraggingScrubber = false;
        });

        volumeSlider.addEventListener('input', (e) => {
            const vol = e.target.value;
            if (player && typeof player.setVolume === 'function') {
                player.setVolume(vol);
                volumeIcon.className = vol == 0 ? "fa-solid fa-volume-xmark text-xs" : "fa-solid fa-volume-high text-xs";
            }
        });

        muteBtn.addEventListener('click', () => {
            if (!player) return;
            if (isMuted) {
                player.unMute();
                isMuted = false;
                volumeIcon.className = "fa-solid fa-volume-high text-xs";
            } else {
                player.mute();
                isMuted = true;
                volumeIcon.className = "fa-solid fa-volume-xmark text-xs";
            }
        });

        let isShuffled = false;
        shuffleBtn.addEventListener('click', () => {
            if (!player) return;
            isShuffled = !isShuffled;
            player.setShuffle(isShuffled);
            shuffleBtn.classList.toggle('accent-text', isShuffled);
        });

        // Settings Listeners
        bgColorPicker.addEventListener('input', (e) => {
            prefs.bgColor = e.target.value;
            bgColorVal.innerText = prefs.bgColor;
            applyPreferences();
            savePreferences();
        });

        accentColorPicker.addEventListener('input', (e) => {
            prefs.accentColor = e.target.value;
            accentColorVal.innerText = prefs.accentColor;
            applyPreferences();
            savePreferences();
        });

        bgUrlInput.addEventListener('change', (e) => {
            prefs.bgImage = e.target.value.trim();
            applyPreferences();
            savePreferences();
        });

        bgFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (evt) {
                    prefs.bgImage = evt.target.result;
                    applyPreferences();
                    savePreferences();
                };
                reader.readAsDataURL(file);
            }
        });

        removeBgBtn.addEventListener('click', () => {
            prefs.bgImage = '';
            applyPreferences();
            savePreferences();
        });

        overlayOpacitySlider.addEventListener('input', (e) => {
            prefs.overlayOpacity = e.target.value;
            applyPreferences();
            savePreferences();
        });

        overlayBlurSlider.addEventListener('input', (e) => {
            prefs.overlayBlur = e.target.value;
            applyPreferences();
            savePreferences();
        });

        settingsToggle.addEventListener('click', () => {
            settingsDrawer.classList.toggle('hidden');
        });

        function extractPlaylistId(input) {
            if (!input) return null;
            if (input.includes('list=')) {
                try {
                    const urlParams = new URLSearchParams(input.split('?')[1]);
                    return urlParams.get('list');
                } catch (e) {}
            }
            return input.trim();
        }

        savePlaylistBtn.addEventListener('click', () => {
            const val = playlistInput.value;
            const extractedId = extractPlaylistId(val);
            if (extractedId) {
                currentPlaylistId = extractedId;
                prefs.playlistId = extractedId;
                savePreferences();
                initializePlayer();
            }
        });

        // Load on DOM ready
        window.addEventListener('DOMContentLoaded', () => {
            loadPreferences();
        });
    </script>
</body>
</html>
